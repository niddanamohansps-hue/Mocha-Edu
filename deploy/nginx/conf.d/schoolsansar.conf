# Tell Django whether the visitor used HTTPS. When a CDN or load balancer in front of nginx terminates TLS it
# sends X-Forwarded-Proto; otherwise use the scheme nginx itself saw.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Upstream definitions
upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3555;
    keepalive 32;
}

# Main HTTP server block (handles local demo and production reverse proxying)
server {
    listen 80;
    listen [::]:80;
    
    # Catch wildcard tenant subdomains and base domains
    server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.localhost$
                ~^(?<subdomain>[a-zA-Z0-9_-]+)\.[a-zA-Z0-9.-]+$
                localhost
                _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Django files (Admin, DRF browsable API)
    location /static/ {
        alias /var/www/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Confidential uploads are never served as plain files. Django serves them through permission-checked API
    # endpoints (the same prefixes protected_media_serve blocks in config/urls.py).
    location ~ ^/media/(submissions|admission_documents|leave_documents|expense_receipts|homework)(/|$) {
        return 403;
    }

    # Target of Django's X-Accel-Redirect for authorised private downloads (USE_X_ACCEL_REDIRECT=True).
    location /protected_media/ {
        internal;
        alias /var/www/media/;
    }

    # Public uploads (profile photos, logos, course content)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Next.js immutable static build assets
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Backend API endpoints
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # Django Admin site
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # Next.js Application Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        # WebSockets support
        proxy_cache_bypass $http_upgrade;
    }
}
