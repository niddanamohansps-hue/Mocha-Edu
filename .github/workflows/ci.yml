name: School Sansar CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Frontend Quality Gate (TypeScript & Next.js Build)
  # ============================================================
  frontend-checks:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tenant_frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tenant_frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ============================================================
  # 2. Backend Quality Gate (Django Checks & Tests)
  # ============================================================
  backend-checks:
    name: Backend Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            labels: core accounts roles organizations profiles
          - name: students
            labels: students families certificates
          - name: money
            labels: expenses fees payments billing payroll
          - name: exams
            labels: examinations.tests_stage_b examinations.tests_stage_c examinations.tests_scope_fixes
          - name: school-life
            labels: front_office ptm homework attendance announcements notifications
    defaults:
      run:
        working-directory: ./backend
    env:
      DEBUG: 'False'
      SECRET_KEY: 'ci-temporary-django-secret-key-for-automated-checks'
      # Throwaway values for CI only. Real keys live in the production environment.
      FIELD_ENCRYPTION_KEY: 'jVju-iUgNvh_gHPnEFodUpsf5mDHDo1hwLbCyLVAcDs='
      CERTIFICATE_INTEGRITY_KEYS: '1:ci-only-certificate-integrity-secret'
      CERTIFICATE_INTEGRITY_ACTIVE_KEY: '1'
      DB_NAME: edusekai_ci
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      # The guard that protects school creation and deletion refuses to run unless the database is declared.
      # The test runner uses test_<this name>, which the guard accepts only while tests run.
      EDUSEKAI_EXPECTED_DATABASE: edusekai_ci@127.0.0.1:5432
      # Copy each test school from one migrated base schema instead of replaying every migration for it.
      EDUSEKAI_TEST_CLONE_TENANTS: '1'
      REDIS_CACHE_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/2

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: edusekai_ci
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev netcat-openbsd

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django System Check
        run: python manage.py check

      - name: Migrations Match Models
        run: python manage.py makemigrations --check --dry-run

      - name: Run Backend Tests
        run: python manage.py test ${{ matrix.labels }} --noinput
