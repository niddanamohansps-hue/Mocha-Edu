version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: EduSekai_db
    ports:
    - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    restart: always

  backend:
    build: .
    container_name: EduSekai_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Migrations at container start are opt-in: only the exact value "true" runs them
      # (see entrypoint.sh and the "Migration safety" section of README.md).
      - RUN_MIGRATIONS_ON_START=${RUN_MIGRATIONS_ON_START:-false}
    depends_on:
      - db
    # The cap applies to ANY backend failure, not only migration failures: after 3
    # consecutive failed restarts the container stays stopped until it is started again.
    restart: on-failure:3

volumes:
  postgres_data:
